# ============================================================
# MarketLens — Docker Compose (local development)
# ============================================================
# Usage:
#   1. Copy web/.env.example → web/.env  (fill in Neon, Stripe, etc.)
#   2. Copy api/.env.example → api/.env
#   3. docker compose up --build
#
# Services:
#   web  – Next.js 14  (http://localhost:3000)
#   api  – FastAPI ETL (http://localhost:8000)
# ============================================================

version: "3.9"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    environment:
      - NODE_ENV=production
      - ETL_SERVICE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      - CORS_ORIGINS=["http://localhost:3000","http://web:3000"]
    restart: unless-stopped
